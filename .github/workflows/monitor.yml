name: Outdoor Price Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: outdoor-price-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          echo "开始运行 monitor.py"
          python -u monitor.py

      - name: Save price history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/prices.json data/discovered_products.json

          if git diff --cached --quiet; then
            echo "价格历史没有变化，不需要提交"
            exit 0
          fi

          git commit -m "Update price history"

          echo "准备同步远程 main 分支"

          for i in 1 2 3 4 5; do
            echo "同步尝试第 $i 次"

            git fetch origin main

            if git rebase origin/main; then
              echo "远程分支同步成功"
            else
              echo "Rebase 失败，尝试中止并重新获取"
              git rebase --abort || true
              sleep $((10 * i))
              continue
            fi

            if git push origin HEAD:main; then
              echo "价格历史推送成功"
              exit 0
            fi

            echo "推送失败，第 $i 次重试..."
            sleep $((20 * i))
          done

          echo "连续 5 次推送失败"
          exit 1
