name: Outdoor Price Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

# 同一时间只允许一个监控任务写价格历史，避免两个运行同时修改 JSON。
concurrency:
  group: outdoor-price-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          echo "开始运行 monitor.py"
          python -u monitor.py

      - name: Save price history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/prices.json data/discovered_products.json data/correction_queue.json

          if git diff --cached --quiet; then
            echo "价格历史没有变化，不需要提交"
            exit 0
          fi

          git commit -m "Update price history"

          echo "准备同步远程 main 分支"
          git fetch origin main

          # 不再使用 rebase。
          # 价格历史是 JSON 快照，两个运行同时更新同一文件时很容易产生
          # rebase 冲突。当前工作流已经通过 concurrency 保证单实例运行，
          # 如果远程在本次运行期间出现变化，则把本次运行的最新价格历史
          # 保留为当前提交，再把远程其它代码变更合并进来。
          if git merge origin/main --no-edit -X ours; then
            echo "远程分支同步成功"
          else
            echo "普通合并失败，执行一次中止并重试"
            git merge --abort || true
            git fetch origin main
            git merge origin/main --no-edit -X ours
          fi

          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "价格历史推送成功"
              exit 0
            fi

            echo "推送失败，第 $i 次重试..."
            git fetch origin main

            # 如果远程又前进了，先合并再推送；JSON 冲突继续保留本次运行结果。
            git merge origin/main --no-edit -X ours || {
              git merge --abort || true
              sleep $((10 * i))
              continue
            }

            sleep $((10 * i))
          done

          echo "连续 5 次推送失败"
          exit 1
